<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogani - Đăng nhập / Đăng ký</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --mau-chu-dao: #7fad39;
            --mau-chu-chinh: #1c1c1c;
            --mau-doan-van: #6f6f6f;
            --mau-nen: #f5f5f5;
            --mau-vien: #ebebeb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--mau-nen);
            background-image: url('https://media.istockphoto.com/id/1659087382/vi/anh/b%C3%A0n-tay-n%C3%B4ng-d%C3%A2n-h%E1%BB%99p-v%C3%A0-rau-trong-nh%C3%A0-k%C3%ADnh-cho-n%C3%B4ng-nghi%E1%BB%87p-kinh-doanh-chu%E1%BB%97i-cung-%E1%BB%A9ng-v%C3%A0-s%E1%BA%A3n.jpg?s=612x612&w=0&k=20&c=hmCJYA9rVoJnsZEUF6g4bJhn9RqZJfaoS7EkhaklFGg=');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Lớp phủ đen mờ làm nổi bật form */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .khung-chua-form {
            position: relative;
            z-index: 2;
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
           
        }

        .dau-form {
            text-align: center;
            padding: 30px 20px 10px;
        }
        .dau-form img {
            max-width: 130px;
            margin-bottom: 15px;
        }
        .dau-form h3 {
            color: var(--mau-chu-chinh);
            font-size: 22px;
            font-weight: 700;
        }

        .form-chuc-nang {
            padding: 0px 30px 40px;
            display: none; 
        }
        .form-chuc-nang.hoat-dong {
            display: block; 
        }

        .nhom-o-nhap {
            margin-bottom: 20px;
            position: relative;
        }
        .nhom-o-nhap i {
            position: absolute;
            top: 30%;
            left: 15px;
          
            color: #b2b2b2;
        }
        .nhom-o-nhap input {
            width: 100%;
            height: 46px;
            border: 1px solid var(--mau-vien);
            border-radius: 25px;
            padding-left: 45px;
            padding-right: 20px;
            font-size: 14px;
            color: var(--mau-chu-chinh);
            outline: none;
        }
        .nhom-o-nhap input:focus {
            border-color: var(--mau-chu-dao);
        }

        .nut-gui {
            width: 100%;
            height: 46px;
            background: var(--mau-chu-dao);
            color: #ffffff;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .nut-gui:hover {
            background: #6a912d;
        }

        .chuyen-doi-form {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--mau-doan-van);
        }
        .chuyen-doi-form a {
            color: var(--mau-chu-dao);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }
        .chuyen-doi-form a:hover {
            color: #1c1c1c;
        }
    </style>
</head>
<body>

    <div class="khung-chua-form">
        <div class="dau-form">
            <a href="#"><img src="https://preview.colorlib.com/theme/ogani/img/logo.png" alt="Ogani Logo"></a>
        </div>

        <div class="form-chuc-nang hoat-dong" id="form-dang-nhap">
            <h3 style="text-align: center; margin-bottom: 20px;">Đăng Nhập</h3>
            <form id="the-form-dang-nhap">
                <div class="nhom-o-nhap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email-dang-nhap" placeholder="Email của bạn" required>
                </div>
                <div class="nhom-o-nhap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="mat-khau-dang-nhap" placeholder="Mật khẩu" required>
                </div>
                <button type="submit" class="nut-gui">Đăng Nhập</button>
                <div class="chuyen-doi-form">
                    Chưa có tài khoản? <a href="#" id="chuyen-sang-dang-ky">Đăng ký ngay</a>
                </div>
            </form>
        </div>

        <div class="form-chuc-nang" id="form-dang-ky">
            <h3 style="text-align: center; margin-bottom: 20px;">Đăng Ký</h3>
            <form id="the-form-dang-ky">
                <div class="nhom-o-nhap">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="ten-dang-ky" placeholder="Họ và tên" required>
                </div>
                <div class="nhom-o-nhap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email-dang-ky" placeholder="Email của bạn" required>
                </div>
                <div class="nhom-o-nhap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="mat-khau-dang-ky" placeholder="Mật khẩu" required>
                </div>
                <button type="submit" class="nut-gui">Tạo Tài Khoản</button>
                <div class="chuyen-doi-form">
                    Đã có tài khoản? <a href="#" id="chuyen-sang-dang-nhap">Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const formDangNhap = document.getElementById('form-dang-nhap');
            const formDangKy = document.getElementById('form-dang-ky');
            const nutChuyenSangDangKy = document.getElementById('chuyen-sang-dang-ky');
            const nutChuyenSangDangNhap = document.getElementById('chuyen-sang-dang-nhap');
            nutChuyenSangDangKy.addEventListener('click', function(e) {
                e.preventDefault();
                formDangNhap.classList.remove('hoat-dong');
                formDangKy.classList.add('hoat-dong');
            });

            nutChuyenSangDangNhap.addEventListener('click', function(e) {
                e.preventDefault();
                formDangKy.classList.remove('hoat-dong');
                formDangNhap.classList.add('hoat-dong');
            });
            document.getElementById('the-form-dang-ky').addEventListener('submit', function(e) {
                e.preventDefault();
                const tenUser = document.getElementById('ten-dang-ky').value;
                const emailUser = document.getElementById('email-dang-ky').value;
                const matKhauUser = document.getElementById('mat-khau-dang-ky').value;
                const taiKhoanNguoiDung = {
                    name: tenUser,
                    email: emailUser,
                    password: matKhauUser
                };
                localStorage.setItem('ogani_user_' + emailUser, JSON.stringify(taiKhoanNguoiDung));

                alert("Đăng ký thành công! Hãy tiến hành đăng nhập.");
                
                this.reset();
                formDangKy.classList.remove('hoat-dong');
                formDangNhap.classList.add('hoat-dong');
            });

           
            document.getElementById('the-form-dang-nhap').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const emailUser = document.getElementById('email-dang-nhap').value;
                const matKhauUser = document.getElementById('mat-khau-dang-nhap').value;

                const duLieuTaiKhoanChuoi = localStorage.getItem('ogani_user_' + emailUser);

                if (duLieuTaiKhoanChuoi) {
                    const taiKhoanGoc = JSON.parse(duLieuTaiKhoanChuoi);

                    if (taiKhoanGoc.password === matKhauUser) {
                        alert("Đăng nhập thành công! Chào mừng " + taiKhoanGoc.name);
                        
                        
                        localStorage.setItem('ogani_current_user', duLieuTaiKhoanChuoi); 
                        window.location.href = "home.html";
                    } else {
                        alert("Sai mật khẩu! Vui lòng thử lại.");
                    }
                } else {
                    alert("Tài khoản không tồn tại! Vui lòng đăng ký.");
                }
            });
        });
    </script>
</body>
</html>
