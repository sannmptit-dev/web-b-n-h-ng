<!DOCTYPE html>
<html>
<head>
    <style>
        /* ĐÃ SỬA: Dùng class .banner thay vì thẻ div chung chung */
        .banner {
           width: 100%;
           height: 200px; /* ĐÃ SỬA: Đổi từ 20% thành 200px để có chiều cao thật */
           background-image: url('https://img.pikbest.com/origin/09/26/48/886pIkbEsTeXi.png!w700wp');
           background-size: cover;
           background-position: center;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           color: rgb(232, 253, 6);
           margin-bottom: 20px;
        }

        /* ĐÃ SỬA: Thêm dấu / vào cuối dòng chú thích */
        /* 1. KHUNG TO NHẤT BỌC BÊN NGOÀI */
        .khung_chinh {
            display: flex; 
            gap: 20px;     
        }

        /* 2. CỘT BÊN TRÁI (MENU) */
        .cot_trai {
            width: 200px; 
            background-color: #f0f0f0; 
            padding: 10px;
        }

        /* 3. CỘT BÊN PHẢI (CHỨA SẢN PHẨM) */
           .cot_phai {
            flex: 1; 
        }

        /* 4. KHU VỰC DÀN HÀNG 3 SẢN PHẨM */
        .danh_sach_san_pham {
            display: flex; 
            gap: 5px;  
        }

        /* 5. TỪNG CÁI HỘP SẢN PHẨM */
        .san_pham {
            border: 1px solid black; 
            padding: 10px;
            text-align: center;
            width: 33%; 
            position: relative; 
        }

        /* 6. TEM GIẢM GIÁ (ĐỊNH VỊ) */
        .tem_giam_gia {
            position: absolute; 
            top: 5px; 
            left: 5px;
            background: red;
            color: white;
            padding: 5px;
            border-radius: 50%; 
        }

        img {
            width: 100px; 
            height: 100px;
        }
    </style>
</head>
<body>
    
    <div class="banner">
        <h1> Organi Shop
        </h1>
        <p> Home- Shop</p>
    </div>

    <div class="khung_chinh">
        
        <div class="cot_trai">
            <h3>Danh mục</h3>
            <ul>
                <li>Thịt tươi</li>
                <li>Rau củ</li>
                <li>Trái cây</li>
            </ul>
        </div>

        <div class="cot_phai">
            <h2>Giảm giá</h2>
            
            <div class="danh_sach_san_pham">
                
                <div class="san_pham">
                    <span class="tem_giam_gia">-20%</span>
                    <img src="https://via.placeholder.com/100" alt="Ảnh 1">
                    <p>Nước ép</p>
                    <b>$30</b> <s>$36</s>
                </div>

                <div class="san_pham">
                    <span class="tem_giam_gia">-20%</span>
                    <img src="https://via.placeholder.com/100" alt="Ảnh 2">
                    <p>Quả xoài</p>
                    <b>$30</b> <s>$36</s>
                </div>

                <div class="san_pham">
                    <span class="tem_giam_gia">-20%</span>
                    <img src="https://via.placeholder.com/100" alt="Ảnh 3">
                    <p>Hamburger</p>
                    <b>$30</b> <s>$36</s>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
