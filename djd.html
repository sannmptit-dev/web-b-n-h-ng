<style>
    div {
        width: 500px;
        height: 400px;
        border: 2px dashed #ccc; /* Thêm viền để bạn nhìn rõ cái hộp */
        margin: 20px auto; /* Căn cái hộp ra giữa màn hình */
        
        /* --- PHẦN HÌNH NỀN --- */
        background-image: url(https://png.pngtree.com/png-vector/20250303/ourmid/pngtree-ripe-mango-fruit-with-leaf-for-healthy-snack-png-image_15699037.png);
        background-repeat: no-repeat; 
        background-size: contain;   /* THIẾU CÁI NÀY: Giúp hiện nguyên quả xoài */
        background-position: center; /* THIẾU CÁI NÀY: Đưa quả xoài vào giữa */

        /* --- PHẦN CHỮ --- */
        display: flex;              /* Bật flexbox */
        align-items: flex-end;      /* Đẩy chữ xuống đáy hộp */
        justify-content: center;    /* Căn chữ ra giữa chiều ngang */
        padding-bottom: 20px;       /* Cách đáy một chút cho đẹp */
        
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-size: 24px;
        color: #ff9f43;             /* Màu cam cho hợp với xoài */
    }
</style>
